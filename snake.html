<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klon Arcade & Surprise Vault</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-bright: #f0f6fc;
      --text-main: #c9d1d9;
      --accent-green: #7ee787;
      --accent-blue: #58a6ff;
      --accent-purple: #a371f7;
      --accent-orange: #f0883e;
      --accent-red: #da3633;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .arcade-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text-bright);
      margin-bottom: 4px;
    }

    .arcade-subtitle {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 16px;
    }

    /* Liste des jeux */
    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .game-card-item {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      transition: border-color 0.2s, transform 0.2s;
    }

    .game-card-item.unlocked {
      border-color: var(--accent-green);
      cursor: pointer;
    }

    .game-card-item.unlocked:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(126, 231, 135, 0.15);
    }

    .game-card-item.locked {
      opacity: 0.65;
      border-style: dashed;
      cursor: not-allowed;
    }

    .game-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .game-info { flex: 1; }

    .game-name {
      font-weight: bold;
      color: var(--text-bright);
      font-size: 0.95rem;
    }

    .game-req {
      font-size: 0.75rem;
      color: var(--accent-orange);
      margin-top: 2px;
    }

    .game-highscore-tag {
      font-size: 0.75rem;
      color: var(--accent-green);
      margin-top: 3px;
      font-weight: bold;
    }

    /* Styles Game Snake */
    .snake-scores-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .snake-score-box {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-bright);
      background: var(--bg-color);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      flex: 1;
    }

    canvas#snake-canvas {
      background-color: #010409;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    .snake-dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 170px;
      height: 170px;
      margin: 12px auto 0 auto;
    }

    .dpad-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
    }

    .dpad-btn:active { background: var(--border-color); }

    .btn-action {
      background-color: #238636;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .btn-secondary {
      background-color: var(--bg-color);
      color: var(--accent-blue);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <button class="btn-action" onclick="openArcadeVault({ id: 1, name: 'Loyer', image: null })">
    🕹️ Tester l'ouverture du Coffre
  </button>

  <!-- MODAL COFFRE À JEUX (KLON ARCADE) -->
  <div id="arcade-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="arcade-title">🎁 Coffre à Jeux Klon</div>
      <div class="arcade-subtitle">
        Poursuis ton indépendance pour déverrouiller des jeux secrets !
      </div>

      <div class="games-grid" id="games-grid"></div>

      <button class="btn-secondary" style="width: 100%;" onclick="closeArcadeModal()">Fermer</button>
    </div>
  </div>

  <!-- MODAL JEU SNAKE 2 -->
  <div id="snake-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="arcade-title" id="snake-player-title">🐍 Snake 2</div>
      <div class="arcade-subtitle" id="snake-player-subtitle">Récolte un maximum de dividendes !</div>
      
      <div class="snake-scores-row">
        <div class="snake-score-box">
          Score : <strong id="snake-score" style="color: var(--accent-green);">0</strong> 🪙
        </div>
        <div class="snake-score-box">
          Record : <strong id="snake-highscore" style="color: var(--accent-orange);">0</strong>
        </div>
      </div>

      <div id="highscore-details" style="font-size: 0.72rem; opacity: 0.8; margin-bottom: 8px; min-height: 16px;"></div>

      <canvas id="snake-canvas" width="280" height="280"></canvas>

      <!-- Pad Mobile -->
      <div class="snake-dpad">
        <div></div>
        <button class="dpad-btn" onclick="setSnakeDir('UP')">▲</button>
        <div></div>
        <button class="dpad-btn" onclick="setSnakeDir('LEFT')">◄</button>
        <div></div>
        <button class="dpad-btn" onclick="setSnakeDir('RIGHT')">►</button>
        <div></div>
        <button class="dpad-btn" onclick="setSnakeDir('DOWN')">▼</button>
        <div></div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button class="btn-action" style="flex:1;" onclick="startSnakeGame()">🔄 Rejouer</button>
        <button class="btn-secondary" style="flex:1;" onclick="closeSnakeGame()">Retour</button>
      </div>
    </div>
  </div>

  <script>
    let selectedKlonForGame = null;
    let headImageObj = null;

    // Métriques globales du compte
    const userAppStats = {
      completedKlonsCount: 2,
      globalAutonomyPct: 45
    };

    // Liste des jeux (Les jeux verrouillés restent anonymes)
    const ARCADE_GAMES = [
      {
        id: 'snake2',
        name: 'Klon Snake 2',
        icon: '🐍',
        minKlonsReq: 1,
        minPctReq: 0,
        desc: 'Mange des dividendes et traverse les murs !'
      },
      {
        id: 'secret_game_1',
        name: 'Jeu Mystère I',
        icon: '❓',
        minKlonsReq: 3,
        minPctReq: 25,
        desc: 'Débloque ce secret en finançant plus de Klons.'
      },
      {
        id: 'secret_game_2',
        name: 'Jeu Mystère II',
        icon: '❓',
        minKlonsReq: 5,
        minPctReq: 50,
        desc: 'Un défi arcade réservé aux hauts niveaux d\'autonomie.'
      },
      {
        id: 'secret_game_3',
        name: 'Jeu Mystère Ultime',
        icon: '❓',
        minKlonsReq: 10,
        minPctReq: 100,
        desc: 'Le jeu suprême accessible à l\'indépendance totale !'
      }
    ];

    function getHighScoreData(gameId) {
      return JSON.parse(localStorage.getItem(`klon_highscore_${gameId}`)) || { score: 0, klonName: '-', dateStr: '-' };
    }

    function saveHighScoreData(gameId, score, klonName) {
      const nowStr = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
      const record = { score, klonName, dateStr: nowStr };
      localStorage.setItem(`klon_highscore_${gameId}`, JSON.stringify(record));
      return record;
    }

    function openArcadeVault(klonData) {
      selectedKlonForGame = klonData;

      if (klonData && klonData.image) {
        headImageObj = new Image();
        headImageObj.src = klonData.image;
      } else {
        headImageObj = null;
      }

      const grid = document.getElementById('games-grid');
      grid.innerHTML = '';

      ARCADE_GAMES.forEach(game => {
        const isUnlocked = userAppStats.completedKlonsCount >= game.minKlonsReq && 
                           userAppStats.globalAutonomyPct >= game.minPctReq;

        if (isUnlocked) {
          const hs = getHighScoreData(game.id);
          const hsText = hs.score > 0 ? `🏆 Record : ${hs.score} par ${hs.klonName} (${hs.dateStr})` : 'Pas encore de record';

          grid.innerHTML += `
            <div class="game-card-item unlocked" onclick="launchGame('${game.id}')">
              <div class="game-icon">${game.icon}</div>
              <div class="game-info">
                <div class="game-name">${game.name}</div>
                <div style="font-size: 0.75rem; opacity: 0.7;">${game.desc}</div>
                <div class="game-highscore-tag">${hsText}</div>
              </div>
              <div style="font-size: 1.2rem;">▶️</div>
            </div>
          `;
        } else {
          let reqText = [];
          if (game.minKlonsReq > 0) reqText.push(`${game.minKlonsReq} Klon(s) à 100%`);
          if (game.minPctReq > 0) reqText.push(`${game.minPctReq}% d'autonomie`);

          grid.innerHTML += `
            <div class="game-card-item locked">
              <div class="game-icon">🔒</div>
              <div class="game-info">
                <div class="game-name">🔒 Jeu Verrouillé</div>
                <div class="game-req">Requis : ${reqText.join(' & ')}</div>
              </div>
            </div>
          `;
        }
      });

      document.getElementById('arcade-modal').classList.add('active');
    }

    function closeArcadeModal() {
      document.getElementById('arcade-modal').classList.remove('active');
    }

    function launchGame(gameId) {
      if (gameId === 'snake2') {
        closeArcadeModal();
        
        const klonName = selectedKlonForGame ? selectedKlonForGame.name : 'Joueur';
        document.getElementById('snake-player-subtitle').innerText = `Klon en jeu : ${klonName}`;
        
        updateHighScoreDisplay();
        document.getElementById('snake-modal').classList.add('active');
        startSnakeGame();
      }
    }

    function updateHighScoreDisplay() {
      const hs = getHighScoreData('snake2');
      document.getElementById('snake-highscore').innerText = hs.score;
      
      const detailsEl = document.getElementById('highscore-details');
      if (hs.score > 0) {
        detailsEl.innerText = `👑 Record : ${hs.score} 🪙 par ${hs.klonName} le ${hs.dateStr}`;
      } else {
        detailsEl.innerText = 'Aucun record établi pour le moment.';
      }
    }

    function closeSnakeGame() {
      if (snakeGameTimeout) clearTimeout(snakeGameTimeout);
      document.getElementById('snake-modal').classList.remove('active');
      openArcadeVault(selectedKlonForGame);
    }

    // --- MOTEUR SNAKE 2 ---
    let snakeGameTimeout = null;
    let snake = [];
    let snakeFood = { x: 0, y: 0, icon: '🪙' };
    let snakeDir = 'RIGHT';
    let nextDir = 'RIGHT';
    let snakeScore = 0;
    let currentSpeed = 180;

    const GRID_SIZE = 14;
    const TILE_SIZE = 20;

    function startSnakeGame() {
      if (snakeGameTimeout) clearTimeout(snakeGameTimeout);
      
      snake = [
        { x: 5, y: 7 },
        { x: 4, y: 7 },
        { x: 3, y: 7 }
      ];
      snakeDir = 'RIGHT';
      nextDir = 'RIGHT';
      snakeScore = 0;
      currentSpeed = 180;
      
      document.getElementById('snake-score').innerText = snakeScore;
      spawnFood();
      gameLoop();
    }

    function setSnakeDir(dir) {
      if (dir === 'UP' && snakeDir !== 'DOWN') nextDir = 'UP';
      if (dir === 'DOWN' && snakeDir !== 'UP') nextDir = 'DOWN';
      if (dir === 'LEFT' && snakeDir !== 'RIGHT') nextDir = 'LEFT';
      if (dir === 'RIGHT' && snakeDir !== 'LEFT') nextDir = 'RIGHT';
    }

    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('snake-modal').classList.contains('active')) return;
      if (e.key === 'ArrowUp') { setSnakeDir('UP'); e.preventDefault(); }
      if (e.key === 'ArrowDown') { setSnakeDir('DOWN'); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { setSnakeDir('LEFT'); e.preventDefault(); }
      if (e.key === 'ArrowRight') { setSnakeDir('RIGHT'); e.preventDefault(); }
    });

    function spawnFood() {
      const icons = ['🪙', '💵', '💰', '✨'];
      let validPos = false;
      
      while (!validPos) {
        snakeFood.x = Math.floor(Math.random() * GRID_SIZE);
        snakeFood.y = Math.floor(Math.random() * GRID_SIZE);
        validPos = !snake.some(part => part.x === snakeFood.x && part.y === snakeFood.y);
      }
      
      snakeFood.icon = icons[Math.floor(Math.random() * icons.length)];
    }

    function gameLoop() {
      updateSnake();
      drawSnake();
    }

    function updateSnake() {
      snakeDir = nextDir;
      const head = { ...snake[0] };

      if (snakeDir === 'UP') head.y--;
      if (snakeDir === 'DOWN') head.y++;
      if (snakeDir === 'LEFT') head.x--;
      if (snakeDir === 'RIGHT') head.x++;

      if (head.x < 0) head.x = GRID_SIZE - 1;
      if (head.x >= GRID_SIZE) head.x = 0;
      if (head.y < 0) head.y = GRID_SIZE - 1;
      if (head.y >= GRID_SIZE) head.y = 0;

      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          handleGameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === snakeFood.x && head.y === snakeFood.y) {
        snakeScore += 10;
        document.getElementById('snake-score').innerText = snakeScore;
        currentSpeed = Math.max(70, currentSpeed - 2.5);
        spawnFood();
      } else {
        snake.pop();
      }

      snakeGameTimeout = setTimeout(gameLoop, currentSpeed);
    }

    function handleGameOver() {
      const currentHs = getHighScoreData('snake2');
      const activeKlonName = selectedKlonForGame ? selectedKlonForGame.name : 'Klon';

      if (snakeScore > currentHs.score) {
        saveHighScoreData('snake2', snakeScore, activeKlonName);
        alert(`🎉 NOUVEAU RECORD ! ${snakeScore} dividendes accumulés par ${activeKlonName} !`);
      } else {
        alert(`💥 Game Over ! Score final : ${snakeScore} dividendes.`);
      }

      updateHighScoreDisplay();
      startSnakeGame();
    }

    function drawSnake() {
      const canvas = document.getElementById('snake-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grille
      ctx.strokeStyle = '#161b22';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath(); ctx.moveTo(i * TILE_SIZE, 0); ctx.lineTo(i * TILE_SIZE, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * TILE_SIZE); ctx.lineTo(canvas.width, i * TILE_SIZE); ctx.stroke();
      }

      // Food
      ctx.font = '15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(
        snakeFood.icon, 
        snakeFood.x * TILE_SIZE + TILE_SIZE / 2, 
        snakeFood.y * TILE_SIZE + TILE_SIZE / 2 + 1
      );

      // Snake Body & Head
      snake.forEach((part, idx) => {
        const cx = part.x * TILE_SIZE + TILE_SIZE / 2;
        const cy = part.y * TILE_SIZE + TILE_SIZE / 2;

        if (idx === 0) {
          if (headImageObj && headImageObj.complete) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, (TILE_SIZE / 2) - 1, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(headImageObj, part.x * TILE_SIZE + 1, part.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.restore();

            ctx.strokeStyle = '#7ee787';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, (TILE_SIZE / 2) - 1, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👑', cx, cy);
          }
        } else {
          ctx.fillStyle = idx % 2 === 0 ? '#7ee787' : '#58a6ff';
          ctx.strokeStyle = '#0d1117';
          ctx.lineWidth = 1.5;

          ctx.beginPath();
          ctx.arc(cx, cy, (TILE_SIZE / 2) - 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      });
    }
  </script>
</body>
</html>
